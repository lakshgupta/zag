name: release

# ──────────────────────────────────────────────────────────────────────────
# Build + publish zag release artifacts on every v* tag push.
#
# The 6 (OS, arch) pairs in the build matrix below MUST mirror:
#   - scripts/package.sh `TARGETS` array (the staging filenames it
#     archives from)
#   - scripts/install.sh's detect_platform `PLATFORM_FILE`
#   - zag-install.sh at the repo root (the user-facing curl-pipe installer)
#   - docs/manual/32-building.md § Distribution
# Keep all four lists in lockstep — adding a target here without
# updating the others would silently "vaporize" that platform's
# install path on a fresh `bash zag-install.sh --version v0.1.0`.
#
# Every archive ALSO carries the installers (`zag-install.sh` +
# `install.ps1`) so it is self-contained — running `./zag-install.sh`
# inside the extracted archive installs the bundled binary. The same two
# scripts are uploaded as standalone release assets (see the publish job's
# `files:` list). This must mirror scripts/package.sh's staging set.
#
# Archive NAMES embed the bare version (`zag-0.2.0-linux-x86_64.tar.gz`),
# constructed identically in scripts/package.sh, scripts/install.sh
# (PLATFORM_FILE), scripts/install.ps1 ($FileName), zag-install.sh
# ($ARCHIVE), and here (the `archive=` line below). The installers
# resolve `latest` via the GitHub API because the filename's version
# segment isn't knowable statically.
#
# Triggers:
#   - `v*` tags (e.g. `v0.1.0`)            → build + publish release
#   - workflow_dispatch (any branch)       → build only, artifacts only
# Tag-triggered releases give a single canonical point of truth (the tag
# itself). workflow_dispatch exists for pre-tag validation:
# `gh workflow run release.yml --ref <branch>` runs test + build + package
# and uploads the archives as workflow artifacts (visible for 90 days)
# WITHOUT minting a release — the publish job is gated on tag context
# (`if: startsWith(github.ref, 'refs/tags/')`) because on a branch
# dispatch `github.ref_name` is the branch name, and action-gh-release
# would otherwise try to create a tag/release named after the branch.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  # Pre-tag validation: dispatching on a branch runs test + build + package
  # and uploads workflow artifacts, but never publishes (publish job is
  # gated on tag context below).
  workflow_dispatch:

permissions:
  contents: write

# One in-flight release per ref. Cancels any prior in-progress run for
# the same tag so a force-pushed tag doesn't keep two matrix jobs
# cooking over the same artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: '0.16.0'

jobs:
  # ── Quick smoke gate ─────────────────────────────────────────────────
  # A couple of minutes on ubuntu-latest (the unit suite is ~1 min; the
  # example suite adds ~1 min of parallel `zag test` subprocesses).
  # Catches obvious build breakage before burning 6 cross-compile targets
  # (which run sequentially to a single runner + take ~5-8 minutes total).
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Also runs the discarded-result audit (`zig build audit`, wired into
      # the test step): a lib/std close/sync/read/write result discarded
      # without a `deliberate discard` marker fails here rather than
      # shipping as a silent failure path.
      - name: zig build test
        run: zig build test
      # Runs `zag test` over every test-bearing example fixture -- the rows
      # `zig build test` (in-process Zig graph, never reads a .zag file) and
      # examples/run_all.sh (runs `main`, skips */tests/*) both miss. The
      # fixtures are discovered from examples/ at config time and run in
      # file or project mode as their layout requires; the step pins
      # ZAG_ZIG_PATH to the zig on $PATH itself, which is what setup-zig
      # provides -- see detectZigOnPath in build.zig.
      - name: zig build example_tests
        run: zig build example_tests

  # ── Cross-compile all 6 (OS, arch) targets ───────────────────────────
  # Single ubuntu-latest runner + zig 0.16's bundled LLVM / MinGW /
  # Apple-SDK cross-compile backend → produces darwin + windows
  # binaries from a linux host, no 3-host runner matrix needed. The
  # `bare_target` field on each matrix row is the user-facing
  # `<os>-<arch>` slug (e.g. `darwin-x86_64`) that
  # scripts/package.sh / `zag-install.sh` / `scripts/install.sh` also
  # use — keeping a single canonical name across the 4 sites is the
  # only way a `bash zag-install.sh --version v0.1.0` install on a
  # fresh machine actually finds the right archive.
  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            bare: linux-x86_64
            suffix: ''
          - target: aarch64-linux-gnu
            bare: linux-arm64
            suffix: ''
          - target: x86_64-macos-none
            bare: darwin-x86_64
            suffix: ''
          - target: aarch64-macos-none
            bare: darwin-arm64
            suffix: ''
          - target: x86_64-windows-gnu
            bare: windows-x86_64
            suffix: '.exe'
          - target: aarch64-windows-gnu
            bare: windows-arm64
            suffix: '.exe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cross-compile ${{ matrix.target }}
        run: >
          zig build install
          -Dtarget=${{ matrix.target }}
          -Doptimize=ReleaseFast
          --prefix ${{ runner.temp }}/stage/${{ matrix.target }}
      - name: Restage into scripts/package.sh layout
        shell: bash
        # Re-emit the staged binary at the path scripts/install.sh's
        # detect_platform + zag-install.sh's detect_platform build:
        # `zag-<os>-<arch>{.exe}`. Mirror the filename transform from
        # scripts/package.sh's TARGETS array so a local
        # `./scripts/package.sh 0.1.0 --bin-dir zig-out/bin/`
        # reproduces the exact same on-disk layout as this CI step.
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/bins"
          src="${{ runner.temp }}/stage/${{ matrix.target }}/bin/zag${{ matrix.suffix }}"
          dst="${{ runner.temp }}/bins/zag-${{ matrix.bare }}${{ matrix.suffix }}"
          cp "$src" "$dst"
          chmod +x "$dst"
          ls -l "$dst"
          "$dst" version || true
      - name: Upload per-binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ runner.temp }}/bins/*
          if-no-files-found: error

  # ── Aggregate + archive + checksum ───────────────────────────────────
  # Download all 6 binaries, lay them out under `dist/<version>/` with
  # the same archive filenames scripts/package.sh writes locally, and
  # emit SHA256 checksums so users can verify their `zag-install.sh`
  # download. We do NOT shell out to scripts/package.sh here because
  # package.sh expects binaries at `<BIN_DIR>/zag-<os>-<arch>{.exe}` —
  # that directory layout matches `zig-out/bin/`, not the
  # `$RUNNER_TEMP/bins/` shape we already produced. Mirroring
  # package.sh's tar/zip/sha256 logic verbatim keeps on-CI + on-dev
  # release shape identical, which is the audit trail maintainers
  # need when reproducing a release locally.
  package:
    # NOTE: job-level `name:` is validated at workflow-parse time, where the
    # `steps` context does not exist — using `${{ steps.version.outputs.* }}`
    # here is a startup_failure that kills the whole workflow (0s, no jobs).
    # The versioned directory name is computed inside the job's steps.
    name: Package archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version (strip leading 'v')
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"
      - name: Download all 6 binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/bins
          merge-multiple: true
      - name: Layout dist/<version>/
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          out_dir="dist/$VERSION"
          mkdir -p "$out_dir"
          for src in ${{ runner.temp }}/bins/*; do
            base="$(basename "$src")"
            is_win=0
            case "$base" in
              *.exe) is_win=1; bare="${base%.exe}" ;;
              *)     bare="$base" ;;
            esac
            # tar.gz for linux/darwin; zip for windows. Matches
            # scripts/package.sh's TARGETS archive-ext column and
            # zag-install.sh's detect_platform EXT assignment.
            archive_ext="tar.gz"
            case "$bare" in
              zag-windows-*) archive_ext="zip" ;;
            esac
            staging="$(mktemp -d)"
            if [ "$is_win" -eq 1 ]; then
              cp "$src" "$staging/zag.exe"
            else
              cp "$src" "$staging/zag"
              chmod +x "$staging/zag"
            fi
            echo "$VERSION" > "$staging/VERSION"
            # Ship the installers in every archive (mirrors
            # scripts/package.sh): the archive is self-contained — running
            # ./zag-install.sh inside it installs the bundled binary.
            cp "$GITHUB_WORKSPACE/zag-install.sh" "$staging/zag-install.sh"
            chmod +x "$staging/zag-install.sh"
            cp "$GITHUB_WORKSPACE/scripts/install.ps1" "$staging/install.ps1"
            # Versioned archive name (`zag-0.2.0-<os>-<arch>.<ext>` — the
            # bare version, matching package.sh + the installers' filename
            # construction).
            archive="$out_dir/zag-$VERSION-${bare#zag-}.$archive_ext"
            if [ "$archive_ext" = "tar.gz" ]; then
              tar -czf "$archive" -C "$staging" zag VERSION zag-install.sh install.ps1
            else
              ( cd "$staging" && zip -q "$OLDPWD/$archive" zag.exe VERSION zag-install.sh install.ps1 )
            fi
            echo "  packaged: $archive ($(du -h "$archive" | cut -f1))"
            rm -rf "$staging"
          done
      - name: Include standalone install scripts in dist/
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          out_dir="dist/$VERSION"
          cp zag-install.sh "$out_dir/zag-install.sh"
          chmod +x "$out_dir/zag-install.sh"
          cp scripts/install.ps1 "$out_dir/install.ps1"
          echo "--- dist contents:"
          ls -l "$out_dir"
      - name: Generate SHA256 checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ( cd "dist/$VERSION" && sha256sum *.{tar.gz,zip} > checksums.txt )
          echo "---"
          cat "dist/$VERSION/checksums.txt"
      - name: Upload release archives as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/**
          if-no-files-found: error

  # ── Publish GitHub Release ───────────────────────────────────────────
  # Triggered only on tag push (the workflow `on:` above filters out
  # everything else). Computes version inline so the GitHub Release
  # tag name matches the source ref exactly.
  publish:
    name: Publish GitHub Release
    needs: package
    # Only on a real tag push. On a workflow_dispatch (branch ref) run this
    # job is skipped, so dispatch runs are build+package validation only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist
      - name: Compute version (strip leading 'v')
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zag ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.version.outputs.version }}/*.tar.gz
            dist/${{ steps.version.outputs.version }}/*.zip
            dist/${{ steps.version.outputs.version }}/checksums.txt
            dist/${{ steps.version.outputs.version }}/zag-install.sh
            dist/${{ steps.version.outputs.version }}/install.ps1
